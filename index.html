<style>
/* VOICE: tender, warm, night-sky romance taken from their own logo (gold ح, silver ل, moon), playful-but-calm — a private shared journal for two
   IDEA: a little shared scrapbook of "our moments", with a plans list and a counter of days together
   PICTURE: two interlocking monogram rings (ح + ل) with a heart where they meet, on a deep plum band
   COLOUR and TYPE: night navy band with stars and moon glow, gold accent, silver text; Aref Ruqaa calligraphy for names, El Messiri headings + IBM Plex Sans Arabic body
   LAYOUT: phone-first single column, hero band, tab content, floating add button, bottom sheets */
:root{color-scheme:light dark;
--bg:light-dark(#f5f3fa,#0b0e24);--card:light-dark(#ffffff,#151a38);--ink:light-dark(#151a3a,#f4efe2);
--mute:light-dark(#696c8c,#a7a5c3);--line:light-dark(#e3e1ef,#272c52);--rose:light-dark(#a8721a,#efc466);--on:light-dark(#fff,#14112c);
--plum:#1a2052;--plum2:#090c24;--soft:light-dark(#f4ecda,#231f45);--gold:#f1cf83}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html{touch-action:pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "El Messiri",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"El Messiri",system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
svg text{font-family:"El Messiri",system-ui,sans-serif}
button{font-family:"El Messiri",system-ui,sans-serif}
.date b,.row .n,.crow .n,.pv,.day,.evr .cd,.log,.streak,.n,.kpi b,.rfig b,.big,.cur,.days b,.ev b,#albn{font-family:"El Messiri",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.big,.cur,.days b,.rfig b,.date b,.ev b,.pv{font-weight:700}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto}
.hero{background:radial-gradient(circle at 12% 22%,rgba(255,230,170,.9) 0 1.2px,transparent 2px),radial-gradient(circle at 34% 8%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 58% 30%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 80% 12%,rgba(255,230,170,.9) 0 1px,transparent 1.6px),radial-gradient(circle at 46% 62%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 90% 70%,#fff 0 1px,transparent 1.6px),radial-gradient(55% 45% at 6% 18%,rgba(241,207,131,.28),transparent 70%),radial-gradient(120% 90% at 85% 0%,#2c2f6e 0%,var(--plum) 45%,var(--plum2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) max(5vw,18px) 26px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{background:rgba(255,255,255,.14);border-radius:99px;padding:8px 14px;font-size:14px;min-height:40px}
.gear{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pic{display:flex;align-items:center;gap:18px;margin-top:14px}
.logo{height:min(54vw,220px);width:auto;flex:none;filter:drop-shadow(0 0 14px rgba(241,207,131,.35)) drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.names{font-family:"Aref Ruqaa",serif;font-weight:700;color:var(--gold);font-size:clamp(38px,11vw,56px);line-height:1.2}
.days{margin-top:8px;font-size:17px;opacity:.92}
.days b{font-family:"El Messiri";font-size:30px;color:var(--gold);margin-inline-end:4px}
.days button{color:var(--gold);text-decoration:underline;padding:6px 0;min-height:44px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.kpi{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-family:"El Messiri";font-size:24px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:13px;opacity:.8}
.soon{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.ev{flex:none;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:14px;white-space:nowrap}
.ev b{color:var(--gold);font-family:"El Messiri";font-size:17px}
.ev.today{background:var(--gold);color:#14112c}.ev.today b{color:#14112c}
.tabs{display:flex;gap:4px;padding:max(10px,env(safe-area-inset-top)) max(4vw,12px) 10px;position:sticky;top:0;z-index:5;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to left,transparent 0,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to left,transparent 0,#000 14px,#000 calc(100% - 22px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 0;scroll-snap-align:center;color:color-mix(in srgb,var(--ink) 82%,transparent);font-size:14.5px;font-weight:600;line-height:1.2;letter-spacing:0;white-space:nowrap;background:none}
.tabs .ic{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:background .3s,border-color .3s,box-shadow .3s,transform .25s cubic-bezier(.2,.9,.25,1)}
.tabs .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true]{color:var(--rose);font-weight:800}
.tabs button[aria-selected=true] .ic{background:linear-gradient(145deg,var(--gold),var(--rose));border-color:transparent;color:#14112c;box-shadow:0 6px 18px rgba(200,150,50,.35);transform:translateY(-2px)}
.tabs button:active .ic{transform:scale(.92)}
main{padding:8px max(5vw,18px) calc(110px + env(safe-area-inset-bottom))}
.tools{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.search{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:var(--on)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.month{font-size:14px;color:var(--mute);margin:18px 4px 8px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.date{flex:none;width:48px;text-align:center;border-inline-end:1px solid var(--line);padding-inline-end:12px}
.date b{display:block;font-family:"El Messiri";font-size:26px;line-height:1.1}
.date span{font-size:12px;color:var(--mute)}
.body{flex:1}
.body h3{font-size:18px;margin-bottom:4px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mute);align-items:center}
.meta .tag{display:inline-flex;align-items:center;gap:5px}
.note{margin:8px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.hearts{display:inline-flex;gap:1px;color:var(--rose)}
.hearts svg{width:14px;height:14px}
.more{flex:none;width:40px;height:40px;border-radius:12px;color:var(--mute);display:grid;place-items:center;margin:-6px -8px 0 0}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.plan{align-items:center}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--rose);display:grid;place-items:center}
.plan.done .check{background:var(--rose);color:var(--on)}
.plan.done h3{text-decoration:line-through;color:var(--mute)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.sec h2{font-size:20px;margin-bottom:12px}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--rose);transition:width .5s}
.row .n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big{font-family:"El Messiri";font-size:34px;line-height:1.1}
.fab{position:fixed;inset-inline-start:max(18px,calc(50% - 300px));bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--rose);color:var(--on);box-shadow:0 10px 28px rgba(200,150,50,.45);display:grid;place-items:center;z-index:10}
.fab svg{width:28px;height:28px}
.scrim{position:fixed;inset:0;background:rgba(5,6,20,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .42s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .3s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;padding:10px max(5vw,18px) calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.scrim.on .sheet{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px;box-shadow:0 0 0 14px transparent;touch-action:none}
.sheet h2{font-size:24px;margin-bottom:14px}
label.l{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px;font-weight:500}
.in{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:42px;border-radius:10px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rate{display:flex;gap:6px}
.rate button{width:44px;height:44px;display:grid;place-items:center;color:var(--line)}
.rate button.on{color:var(--rose)}
.rate svg{width:30px;height:30px}
.acts{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;min-height:52px;border-radius:16px;font-weight:700;background:var(--soft)}
.btn.pri{background:var(--rose);color:var(--on)}
.btn.del{color:var(--rose)}
.toast{position:fixed;bottom:calc(98px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:70;width:max-content;max-width:calc(100vw - 32px);font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--rose);font-weight:700;min-height:36px}
.banner{margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;display:none}
.banner.on{display:block}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.who button{min-height:110px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-family:"El Messiri";font-size:28px}
.small{font-size:13px;color:var(--mute);margin-top:12px}
.pp h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pp .cur{font-family:"El Messiri";font-size:40px;line-height:1.1;white-space:nowrap}
.pp .cur small{font-size:16px;color:var(--mute);margin-inline-start:4px}
.pp .chg{font-size:14px;color:var(--mute);white-space:nowrap}
.fig{position:relative;height:150px;margin:12px 0 4px;direction:ltr}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.logs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.log{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;white-space:nowrap}
.log button{width:28px;height:28px;border-radius:50%;color:var(--mute)}
.mini{display:flex;gap:8px;margin-top:12px}.mini .btn{min-height:44px;font-size:15px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:center}
.score>div{background:var(--soft);border-radius:18px;padding:14px 8px}
.score .big{font-size:44px}.score .big.neg{color:var(--mute)}
.pt{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pv{flex:none;min-width:48px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--soft);color:var(--rose);font-variant-numeric:tabular-nums}
.pv.neg{color:var(--mute)}
.pt .body{font-size:15px}.pt .small{margin:0}
.x{flex:none;width:36px;height:36px;border-radius:50%;color:var(--mute)}
.nt{border-inline-start:4px solid var(--rose)}.nt.thanks{border-inline-start-color:#2bb39a}.nt.ok{opacity:.6}
.ok-btn{margin-top:10px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--soft);font-weight:500;font-size:14px}
.vals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.vals button{min-height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;direction:ltr}
.vals button[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:var(--on)}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calh h2{margin:0}.nav{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.grid .wd{font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-size:15px;min-height:40px}
.day.out{opacity:.3}.day.td{outline:2px solid var(--rose);outline-offset:-2px}
.day[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.day .ds{display:flex;gap:2px;height:6px}.day .ds i{width:6px;height:6px;border-radius:50%}
.evr{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.evr:first-of-type{border-top:0}
.evr .cd{flex:none;min-width:58px;text-align:center;border-radius:12px;background:var(--soft);padding:6px 4px;font-size:12px;color:var(--mute)}
.evr .cd b{display:block;font-family:"El Messiri";font-size:20px;color:var(--rose);line-height:1.1}
.login{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(55% 45% at 10% 15%,rgba(241,207,131,.25),transparent 70%),radial-gradient(120% 90% at 85% 0%,#2c2f6e 0%,#1a2052 45%,#090c24 100%);color:#fff}
.login.on{display:flex}.login form{width:100%;max-width:360px;text-align:center}
.login img{height:180px;filter:drop-shadow(0 0 14px rgba(241,207,131,.35))}
.login h1{font-family:"Aref Ruqaa",serif;color:var(--gold);font-size:44px;margin:8px 0 18px}
.login .in{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;margin-bottom:10px;text-align:start}
.login .in::placeholder{color:rgba(255,255,255,.55)}
.login .btn{width:100%;background:var(--gold);color:#14112c}
.login .err{min-height:22px;font-size:14px;color:#ffb4b4;margin-top:10px}
.albh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px}
.albh .seg{flex:1;max-width:260px}
.alb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
@media(min-width:560px){.alb{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft);padding:0;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{position:absolute;bottom:6px;inset-inline-start:6px;width:18px;height:18px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(5,6,15,var(--va,1));display:flex;flex-direction:column;color:#fff;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s .28s}
.viewer.on{opacity:1;visibility:visible;transition:opacity .28s ease}
#vi{transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s}
.viewer:not(.on) #vi{transform:scale(.9)}
#vi.drag{transition:none}
#vi.swap{animation:fadein .3s ease}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.vtop div{display:flex;gap:8px}
.vbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.vbtn.on{color:var(--gold)}.vbtn svg{width:22px;height:22px}
.vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;overflow:hidden}
.vimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.vnav{position:absolute;top:50%;transform:translateY(-50%)}
.vnav.n{left:10px}.vnav.p{right:10px}
.vcap{padding:12px 18px calc(18px + env(safe-area-inset-bottom));text-align:center}
.vcap p{margin:0 0 4px;font-size:17px;overflow-wrap:anywhere}
.vcap span{font-size:13px;opacity:.7}
.sky{position:absolute;inset:0;z-index:0;pointer-events:none}
.sky>div{position:absolute;inset:0;transition:opacity 1.6s ease}
.sky svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero>.wrap{position:relative;z-index:1}
.hero[data-phase=morning] .names,.hero[data-phase=day] .names,.hero[data-phase=evening] .names{text-shadow:0 2px 14px rgba(20,10,50,.45)}
.hero[data-phase=morning] .days,.hero[data-phase=day] .days,.hero[data-phase=evening] .days{text-shadow:0 1px 8px rgba(20,10,50,.5)}
.hero[data-phase=day] .names{color:#fff3d6}
.signs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sg{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(241,207,131,.16),rgba(255,255,255,.05));border:1px solid rgba(241,207,131,.28);border-radius:16px;padding:6px 12px 6px 8px;color:#fff;text-align:start;min-height:52px}
.sg .cst{width:40px;height:40px;flex:none}
.sg small{display:block;font-size:12px;opacity:.75;line-height:1.2}.sg b{font-family:"El Messiri";color:var(--gold);font-size:16px;line-height:1.3}
.cst line{stroke:rgba(241,207,131,.55);stroke-width:1.2}

.chh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.chh h2{margin:0}
.streak{font-size:13px;background:var(--soft);color:var(--rose);border-radius:99px;padding:4px 10px;font-weight:700;white-space:nowrap}

.dots{display:flex;gap:5px}.dots i{flex:1;height:12px;border-radius:99px;background:var(--soft);transition:background .4s}
.dots i.on{background:linear-gradient(90deg,var(--rose),var(--gold))}
.crow .n{text-align:left;font-variant-numeric:tabular-nums;font-weight:700}
.recap{position:relative;overflow:hidden;border-radius:24px;padding:16px;margin-bottom:12px;color:#fff;background:radial-gradient(60% 50% at 12% 0%,rgba(241,207,131,.28),transparent 70%),linear-gradient(160deg,#2c2f6e,#141838 70%)}
.rch{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center}
.rch small{display:block;font-size:12px;opacity:.7}.rch h2{font-size:24px;color:var(--gold)}
.recap .nav{background:rgba(255,255,255,.12);color:#fff}
.rcov{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin-top:14px}
.rfig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px;text-align:center}
.rfig b{display:block;font-family:"El Messiri";font-size:28px;line-height:1.1;color:#fff}.rfig span{font-size:12px;opacity:.75}
.rbest{margin:14px 0 0;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;font-size:15px}
.rbest small{display:block;font-size:12px;opacity:.7}.rbest .hearts{color:var(--gold)}
.rfoot{display:flex;flex-direction:column;gap:2px;margin-top:10px;font-size:13px;opacity:.8}
.rhint{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:start;border-radius:18px;padding:12px 16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#2c2f6e,#1a2052);border:1px solid rgba(241,207,131,.3)}
.rhint b{color:var(--gold);font-family:"El Messiri";font-size:17px}.rhint span{font-size:13px;opacity:.8}
.lt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.lt:first-of-type{border-top:0}
.lt .body b{display:block;font-size:16px;overflow-wrap:anywhere}
.env{width:44px;height:34px;flex:none;color:var(--rose)}.env rect,.env path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.env use{color:var(--rose)}
.lt.ready .env{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 8px rgba(241,207,131,.8))}}
.seen{color:var(--rose);font-weight:500}
.lbtn{flex:none;min-height:40px;min-width:40px;padding:0 14px;border-radius:12px;background:var(--rose);color:var(--on);font-weight:700;display:grid;place-items:center}
.lbtn.lock{background:var(--soft);color:var(--mute);padding:0}
.paper{background:light-dark(#fffaf0,#1d2045);border:1px solid light-dark(#efe3c8,#2f3466);border-radius:20px;padding:22px 20px;animation:unfold .6s cubic-bezier(.2,.9,.25,1) both;transform-origin:top}
.paper small{color:var(--mute);font-size:13px}.paper h2{font-family:"El Messiri",system-ui,sans-serif;color:var(--rose);font-size:30px;margin:6px 0 12px}
.paper p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.9;margin:0}
.paper .sig{font-family:"El Messiri",system-ui,sans-serif;color:var(--rose);font-size:24px;text-align:left;margin-top:18px}
@keyframes unfold{from{opacity:0;transform:scaleY(.6) translateY(-10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:.2}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.pop-in{animation:rise .45s cubic-bezier(.2,.9,.25,1) both}
.btn,.chip,.fab,.ph,.day,.check,.vbtn,.more,.seg button,.who button,.vals button,.rate button,.nav{transition:transform .12s ease,background .2s,color .2s}
.btn:active,.chip:active,.fab:active,.ph:active,.day:active,.check:active,.vbtn:active,.more:active,.seg button:active,.who button:active,.vals button:active,.nav:active{transform:scale(.95)}
.rate button.on svg,.vbtn.on svg,.check.popped{animation:pop .35s ease}
.fab{transition:transform .2s cubic-bezier(.2,.9,.25,1),box-shadow .2s}
.fab.hide{transform:scale(0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

function drawW(box,k){

 const d=fitData(k),pts=d.logs.map(w=>({t:pd(w.date).getTime(),v:num(w.kg)}));

 const vs=pts.map(p=>p.v).concat(d.target?[d.target]:[]);let lo=Math.min(...vs)-1,hi=Math.max(...vs)+1;
 const t0=pts[0].t,t1=Math.max(pts[pts.length-1].t,t0+864e5),pl=34,pr=14,pt=12,pb=22;
 const x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 let g='';
 [lo+1,hi-1].forEach(v=>g+='<text x="4" y="'+(y(v)+4)+'" font-size="11" fill="currentColor" opacity=".55">'+Math.round(v)+'</text><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="currentColor" opacity=".1"/>');
 if(d.target)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(d.target)+'" y2="'+y(d.target)+'" stroke="var(--rose)" stroke-dasharray="5 5" opacity=".8"/>';
 const path=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join('');
 g+='<path d="'+path+' L'+x(pts[pts.length-1].t)+' '+(H-pb)+' L'+x(t0)+' '+(H-pb)+'Z" fill="var(--rose)" opacity=".1"/><path d="'+path+'" fill="none" stroke="var(--rose)" stroke-width="2.5" stroke-linejoin="round"/>';
 const lp=pts[pts.length-1];g+='<circle cx="'+x(lp.t)+'" cy="'+y(lp.v)+'" r="5" fill="var(--rose)" stroke="var(--card)" stroke-width="2"/>';
 if(W>320){const fd=t=>new Date(t).toLocaleDateString(L,{day:'numeric',month:'short'});g+='<text x="'+pl+'" y="'+(H-5)+'" font-size="11" fill="currentColor" opacity=".55">'+fd(t0)+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" font-size="11" text-anchor="end" fill="currentColor" opacity=".55">'+fd(lp.t)+'</text>'}
 s.innerHTML=g;
}

function shrink(file,max,q,limit,square){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;
  if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=m}
  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  let out=c.toDataURL('image/jpeg',q);while(out.length>limit&&q>0.35){q-=0.08;out=c.toDataURL('image/jpeg',q)}
  URL.revokeObjectURL(url);out.length>limit?rej(new Error('big')):res(out)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};img.src=url})}

{let y0=null,t0=0,dy=0,on=false;

  if(!on){if(dy>6&&sheet.scrollTop<=0){on=true;sheet.classList.add('drag');document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}else if(dy<-6){y0=null;return}else return}
  e.preventDefault();const d=Math.max(0,dy);sheet.style.transform='translateY('+d+'px)';scrim.style.opacity=String(Math.max(.25,1-d/(sheet.offsetHeight*1.1)))},{passive:false});
 const end=()=>{if(y0==null)return;y0=null;if(!on)return;on=false;sheet.classList.remove('drag');const v=dy/Math.max(1,Date.now()-t0);
  if(dy>Math.min(140,sheet.offsetHeight*.3)||v>.6){sheet.style.transform='translateY(105%)';scrim.style.opacity='';scrim.classList.remove('on');if(vIdx<0)document.body.style.overflow='';setTimeout(()=>{if(!scrim.classList.contains('on'))sheet.style.transform=''},450)}

 else{sh='M'+top+'A'+r+' '+r+' 0 0 1 '+bot+'A'+rx+' '+r+' 0 0 '+(k>0?1:0)+' '+top+'Z'}
 const cr=[[-.32,-.28,.16],[.18,-.36,.1],[.36,.12,.14],[-.1,.3,.12],[-.42,.18,.08],[.08,.02,.07],[.3,.42,.07],[-.2,-.02,.06],[.48,-.18,.05],[-.05,-.55,.06]];

 return '<defs><radialGradient id="mg" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fffdf2"/><stop offset=".6" stop-color="#efe6c9"/><stop offset="1" stop-color="#c9bc98"/></radialGradient>'+

  '<radialGradient id="cg" r="50%"><stop offset="0" stop-color="#8a7f64" stop-opacity=".55"/><stop offset=".75" stop-color="#a99c7c" stop-opacity=".35"/><stop offset="1" stop-color="#fffbea" stop-opacity=".5"/></radialGradient>'+

  '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*3.2)+'" fill="url(#mh)"/>'+

  cr.map(([x,y,s])=>'<circle cx="'+(cx+x*r)+'" cy="'+(cy+y*r)+'" r="'+(s*r)+'" fill="url(#cg)"/><circle cx="'+(cx+x*r-s*r*.18)+'" cy="'+(cy+y*r-s*r*.18)+'" r="'+(s*r*.9)+'" fill="none" stroke="#fffdf0" stroke-opacity=".35" stroke-width="'+(r*.012)+'"/>').join('')+
  '<path d="'+sh+'" fill="#070a22" fill-opacity=".86"/></g>'+

}
function heartPath(x,y,s){return 'M'+x+' '+(y+s*.35)+'C'+(x-s*.9)+' '+(y-s*.25)+' '+(x-s*.45)+' '+(y-s*.95)+' '+x+' '+(y-s*.45)+'C'+(x+s*.45)+' '+(y-s*.95)+' '+(x+s*.9)+' '+(y-s*.25)+' '+x+' '+(y+s*.35)+'Z'}

function skySvg(ph){
 const c=SKY[ph],W=400,H=360;seed=7;
 let o='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">'+c.g.map((v,i)=>'<stop offset="'+(i/(c.g.length-1))+'" stop-color="'+v+'"/>').join('')+'</linearGradient>'+

  '<rect width="'+W+'" height="'+H+'" fill="url(#sg)"/>';
 if(c.stars){for(let i=0;i<70;i++){const x=rnd()*W,y=rnd()*H*.85,r=rnd()<.12?1.4:.5+rnd()*.7;o+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'" fill="'+(rnd()<.3?'#ffe6aa':'#fff')+'" opacity="'+((.35+rnd()*.6)*c.stars).toFixed(2)+'"/>'}}
 if(ph==='night'){o+=moonSvg(176,46,48,window.__moonF!=null?window.__moonF:moonPhase(Date.now()))+'<path d="'+heartPath(150,40,7)+'" fill="#f1cf83" opacity=".5"/><path d="'+heartPath(340,150,5)+'" fill="#f1cf83" opacity=".35"/>'}
 if(c.sun){const[x,y,r]=c.sun;o+='<circle cx="'+x+'" cy="'+y+'" r="'+(r*3)+'" fill="url(#sun)"/><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c.sun[3]+'" opacity=".85"/>'}
 if(c.clouds){o+=cloud(ph==='day'?90:300,ph==='morning'?120:ph==='evening'?80:150,26,ph==='day'?.55:.22)+cloud(ph==='day'?250:140,ph==='day'?205:200,18,ph==='day'?.4:.16)+
  '<path d="'+heartPath(ph==='evening'?320:120,ph==='day'?60:70,9)+'" fill="#fff" opacity="'+(ph==='day'?.5:.3)+'"/><path d="'+heartPath(ph==='evening'?350:155,ph==='day'?42:52,5)+'" fill="#fff" opacity="'+(ph==='day'?.4:.22)+'"/>'}
 if(ph!=='night')o+='<rect width="'+W+'" height="'+H+'" fill="url(#ov)"/><defs><linearGradient id="ov" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#0b0e30" stop-opacity="0"/><stop offset="1" stop-color="#0b0e30" stop-opacity="'+(ph==='day'?.45:.35)+'"/></linearGradient></defs>';
 return o+'</svg>';
}
