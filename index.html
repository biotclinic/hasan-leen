<style>
/* VOICE: tender, warm, night-sky romance taken from their own logo (gold ح, silver ل, moon), playful-but-calm — a private shared journal for two
   IDEA: a little shared scrapbook of "our moments", with a plans list and a counter of days together
   PICTURE: two interlocking monogram rings (ح + ل) with a heart where they meet, on a deep plum band
   COLOUR and TYPE: night navy band with stars and moon glow, gold accent, silver text; Aref Ruqaa calligraphy for names, El Messiri headings + IBM Plex Sans Arabic body
   LAYOUT: phone-first single column, hero band, tab content, floating add button, bottom sheets */
:root{color-scheme:light dark;
--bg:light-dark(#f5f3fa,#0b0e24);--card:light-dark(#ffffff,#151a38);--ink:light-dark(#151a3a,#f4efe2);
--mute:light-dark(#696c8c,#a7a5c3);--line:light-dark(#e3e1ef,#272c52);--rose:light-dark(#a8721a,#efc466);--on:light-dark(#fff,#14112c);
--plum:#1a2052;--plum2:#090c24;--soft:light-dark(#f4ecda,#231f45);--gold:#f1cf83}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html{touch-action:pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "El Messiri",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"El Messiri",system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
svg text{font-family:"El Messiri",system-ui,sans-serif}
button{font-family:"El Messiri",system-ui,sans-serif}
.date b,.row .n,.crow .n,.pv,.day,.evr .cd,.log,.streak,.n,.kpi b,.rfig b,.big,.cur,.days b,.ev b,#albn{font-family:"El Messiri",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.big,.cur,.days b,.rfig b,.date b,.ev b,.pv{font-weight:700}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto}
.hero{background:radial-gradient(circle at 12% 22%,rgba(255,230,170,.9) 0 1.2px,transparent 2px),radial-gradient(circle at 34% 8%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 58% 30%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 80% 12%,rgba(255,230,170,.9) 0 1px,transparent 1.6px),radial-gradient(circle at 46% 62%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 90% 70%,#fff 0 1px,transparent 1.6px),radial-gradient(55% 45% at 6% 18%,rgba(241,207,131,.28),transparent 70%),radial-gradient(120% 90% at 85% 0%,#2c2f6e 0%,var(--plum) 45%,var(--plum2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) max(5vw,18px) 26px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{background:rgba(255,255,255,.14);border-radius:99px;padding:8px 14px;font-size:14px;min-height:40px}
.gear{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pic{display:flex;align-items:center;gap:18px;margin-top:14px}
.logo{height:min(54vw,220px);width:auto;flex:none;filter:drop-shadow(0 0 14px rgba(241,207,131,.35)) drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.names{font-family:"Aref Ruqaa",serif;font-weight:700;color:var(--gold);font-size:clamp(38px,11vw,56px);line-height:1.2}
.days{margin-top:8px;font-size:17px;opacity:.92}
.days b{font-family:"El Messiri";font-size:30px;color:var(--gold);margin-inline-end:4px}
.days button{color:var(--gold);text-decoration:underline;padding:6px 0;min-height:44px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.kpi{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-family:"El Messiri";font-size:24px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:13px;opacity:.8}
.soon{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.ev{flex:none;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:14px;white-space:nowrap}
.ev b{color:var(--gold);font-family:"El Messiri";font-size:17px}
.ev.today{background:var(--gold);color:#14112c}.ev.today b{color:#14112c}
.tabs{display:flex;gap:4px;padding:max(10px,env(safe-area-inset-top)) max(4vw,12px) 10px;position:sticky;top:0;z-index:5;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to left,transparent 0,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to left,transparent 0,#000 14px,#000 calc(100% - 22px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 0;scroll-snap-align:center;color:color-mix(in srgb,var(--ink) 82%,transparent);font-size:14.5px;font-weight:600;line-height:1.2;letter-spacing:0;white-space:nowrap;background:none}
.tabs .ic{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:background .3s,border-color .3s,box-shadow .3s,transform .25s cubic-bezier(.2,.9,.25,1)}
.tabs .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

function nextOf(iso){const b=pd(iso),t=pd(today());let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return {days:Math.round((n-t)/864e5),years:n.getFullYear()-b.getFullYear()}}

 if(settings.start)ev.push({iso:settings.start,n:'ذكرى خطبتنا',ty:'a'});
 const list=ev.map(e=>({...e,...nextOf(e.iso)})).filter(e=>e.years>0||e.ty==='b').sort((a,b)=>a.days-b.days);

function recapHtml(){
 const t=pd(today());if(!sumM)sumM=new Date(t.getFullYear(),t.getMonth(),1);
 const ym=ymOf(sumM),inM=d=>String(d||'').startsWith(ym),inT=ts=>ts&&ymOf(new Date(ts))===ym;
 const mm=moments.filter(m=>inM(m.date)),ph=photos.filter(p=>inM(p.date));
 const best=[...mm].sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0)||String(b.date).localeCompare(String(a.date)))[0];
 const cnt={};mm.forEach(m=>cnt[m.cat]=(cnt[m.cat]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 const cover=ph.find(p=>p.fav)||ph[0];
 const pts=k=>points.filter(p=>p.to===k&&inT(p.createdAt)).reduce((a,p)=>a+(Number(p.pts)||0),0);
 const fig=(v,l)=>'<div><b>'+v+'</b><span>'+l+'</span></div>';

 return '<div class="recap"><div class="rch"><button class="nav" data-rm="-1" aria-label="الشهر الماضي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button><div><small>'+(isNow?'شهرنا لهلّق':'ملخّص شهرنا')+'</small><h2>'+sumM.toLocaleDateString(L,{month:'long',year:'numeric'})+'</h2></div><button class="nav" data-rm="1" aria-label="الشهر الجاي"'+(isNow?' disabled style="opacity:.3"':'')+'><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg></button></div>'+
 (cover&&okImg(cover.thumb)?'<img class="rcov" alt="" src="'+cover.thumb+'">':'')+
 (mm.length||ph.length?'<div class="rfig">'+fig(mm.length,'لحظة')+fig(mm.filter(m=>m.cat==='sport').length,'تمرين')+fig(ph.length,'صورة')+fig(plans.filter(p=>p.done&&inT(p.doneAt)).length,'حلم تحقّق')+'</div>'+
  (best?'<p class="rbest"><small>أحلى لحظة</small>'+esc(best.title)+(Number(best.rating)?' '+'<span class="hearts">'+heart.repeat(Math.min(5,Number(best.rating)))+'</span>':'')+'</p>':'')+

 :'<p class="rbest">ما في شي مسجّل بهالشهر.</p>')+'</div>';

 const now=new Date(),months=[];
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push([d.toLocaleDateString(L,{month:'long'}),moments.filter(m=>String(m.date).startsWith(k)).length])}

 // weekly streak
 const wk=d=>{const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+1)%7));return t.getTime()};
 const weeks=new Set(moments.map(m=>wk(pd(m.date))));let s=0,w=wk(new Date());if(!weeks.has(w))w-=6048e5;while(weeks.has(w)){s++;w-=6048e5}

 '<div class="sec"><h2>شو منحب نعمل</h2>'+rows(cats)+'</div>'+
 '<div class="sec"><h2>مين بيسجّل أكتر</h2>'+rows([['حسن',moments.filter(m=>m.by==='hassan').length],['لين',moments.filter(m=>m.by==='leen').length]])+'<div class="small">وعملتوا '+done+' من '+plans.length+' من خططكن</div></div>'+
 (best.length?'<div class="sec"><h2>أحلى لحظات</h2>'+best.map(m=>'<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span>'+esc(m.title)+'</span><span class="n">'+pd(m.date).toLocaleDateString(L,{day:'numeric',month:'short'})+'</span></div>').join('')+'</div>':'');

function drawW(box,k){
 const s=box.querySelector('svg'),W=box.clientWidth,H=box.clientHeight;if(!W)return;
 const d=fitData(k),pts=d.logs.map(w=>({t:pd(w.date).getTime(),v:num(w.kg)}));
 if(pts.length<2){s.innerHTML='<text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" font-size="14" fill="currentColor" opacity=".55" direction="rtl">سجّل وزنك كل أسبوع لتشوف الخط</text>';return}
 const vs=pts.map(p=>p.v).concat(d.target?[d.target]:[]);let lo=Math.min(...vs)-1,hi=Math.max(...vs)+1;
 const t0=pts[0].t,t1=Math.max(pts[pts.length-1].t,t0+864e5),pl=34,pr=14,pt=12,pb=22;
 const x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 let g='';
 [lo+1,hi-1].forEach(v=>g+='<text x="4" y="'+(y(v)+4)+'" font-size="11" fill="currentColor" opacity=".55">'+Math.round(v)+'</text><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="currentColor" opacity=".1"/>');
 if(d.target)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(d.target)+'" y2="'+y(d.target)+'" stroke="var(--rose)" stroke-dasharray="5 5" opacity=".8"/>';
 const path=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join('');
 g+='<path d="'+path+' L'+x(pts[pts.length-1].t)+' '+(H-pb)+' L'+x(t0)+' '+(H-pb)+'Z" fill="var(--rose)" opacity=".1"/><path d="'+path+'" fill="none" stroke="var(--rose)" stroke-width="2.5" stroke-linejoin="round"/>';
 const lp=pts[pts.length-1];g+='<circle cx="'+x(lp.t)+'" cy="'+y(lp.v)+'" r="5" fill="var(--rose)" stroke="var(--card)" stroke-width="2"/>';
 if(W>320){const fd=t=>new Date(t).toLocaleDateString(L,{day:'numeric',month:'short'});g+='<text x="'+pl+'" y="'+(H-5)+'" font-size="11" fill="currentColor" opacity=".55">'+fd(t0)+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" font-size="11" text-anchor="end" fill="currentColor" opacity=".55">'+fd(lp.t)+'</text>'}
 s.innerHTML=g;
}

function shrink(file,max,q,limit,square){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;
  if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=m}
  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  let out=c.toDataURL('image/jpeg',q);while(out.length>limit&&q>0.35){q-=0.08;out=c.toDataURL('image/jpeg',q)}
  URL.revokeObjectURL(url);out.length>limit?rej(new Error('big')):res(out)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};img.src=url})}
async function uploadPhotos(files){
 if(!db)return toast('ما في اتصال هلّق');
 files=[...files].filter(f=>f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
 let ok=0,bad=0;
 for(let i=0;i<files.length;i++){const f=files[i];
  toast('عم نرفع '+(i+1)+' من '+files.length+'…');
  try{const full=await shrink(f,1600,.82,900000,false),thumb=await shrink(f,360,.72,120000,true);
   const ref=db.collection('photos').doc();const d=new Date(f.lastModified||Date.now());
   await db.doc('photoFull/'+ref.id).set({data:full});
   await ref.set({thumb,caption:'',date:iso(d),fav:false,by:me||'',createdAt:Date.now()});ok++}
  catch(e){bad++;if(e&&e.code==='permission-denied')break}
 }
 toast(ok?('انزادت '+ok+(ok===1?' صورة':' صور')+(bad?' · '+bad+' ما زبطت':'')):'ما قدرنا نرفع الصور، جرّبوا كمان مرة');
}
const full={};
const dataToFile=(d,name)=>{const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new File([u],name,{type:'image/jpeg'})};
const photoName=(p,i)=>'hassan-leen-'+(p.date||today())+(i!=null?'-'+(i+1):'')+'.jpg';
async function fullOf(p){if(full[p.id])return full[p.id];try{const s=await db.doc('photoFull/'+p.id).get();const d=s.exists&&s.data().data;if(okImg(d)){full[p.id]=d;return d}}catch(x){}return okImg(p.thumb)?p.thumb:null}
function saveFiles(files){
 try{if(navigator.canShare&&navigator.canShare({files})){return navigator.share({files}).then(()=>true).catch(x=>{if(x&&x.name!=='AbortError')fallbackDl(files);return false})}}catch(x){}
 fallbackDl(files);return Promise.resolve(true)}
function fallbackDl(files){files.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)},i*350))}

const other=k=>k==='hassan'?'leen':'hassan';
const ago=t=>new Date(t||Date.now()).toLocaleDateString(L,{day:'numeric',month:'short'});
const sgn=n=>'\u2066'+(n>0?'+':'')+n+'\u2069';
function renderUs(){
 const el=$('#us');if(!el)return;
 const ym=today().slice(0,7),tot={},mon={};
 for(const k of ['hassan','leen']){const mine=points.filter(p=>p.to===k);tot[k]=mine.reduce((a,p)=>a+(Number(p.pts)||0),0);mon[k]=mine.filter(p=>new Date(p.createdAt||0).toISOString().slice(0,7)===ym).reduce((a,p)=>a+(Number(p.pts)||0),0)}
 const pl=[...points].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,12);
 let out='<div class="sec"><h2>نقاطنا</h2><div class="score">'+['hassan','leen'].map(k=>'<div><div class="small" style="margin:0">'+WHO[k]+'</div><div class="big'+(tot[k]<0?' neg':'')+'">'+sgn(tot[k])+'</div><div class="small" style="margin:0">هالشهر '+sgn(mon[k])+'</div></div>').join('')+'</div>'+
 '<div class="mini"><button class="btn pri" id="givePts">عطي نقاط</button></div>'+
 (pl.length?'<div style="margin-top:12px">'+pl.map(p=>{const v=Number(p.pts)||0;return '<div class="pt"><span class="pv'+(v<0?' neg':'')+'">'+sgn(v)+'</span><div class="body">'+esc(p.reason||'')+'<div class="small">'+esc(WHO[p.from]||'')+' ← '+esc(WHO[p.to]||'')+' · '+ago(p.createdAt)+'</div></div>'+(p.from===me?'<button class="x" data-pdel="'+esc(p.id)+'" aria-label="احذف">×</button>':'')+'</div>'}).join('')+'</div>':'<p class="hint">لسّا ما حدا عطى نقاط. أول شغلة حلوة بتستاهل نقطة!</p>')+'</div>';
 out+=lettersHtml();
 const open=notes.filter(n=>!n.ok),closed=notes.filter(n=>n.ok);
 const nl=(noteView==='open'?open:closed).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 out+='<div class="sec"><h2>ملاحظات لبعض</h2><div class="seg" id="nview"><button data-nv="open" aria-pressed="'+(noteView==='open')+'">مفتوحة ('+open.length+')</button><button data-nv="closed" aria-pressed="'+(noteView==='closed')+'">خلصنا منها ('+closed.length+')</button></div>'+
 '<div class="mini"><button class="btn pri" id="addNote">اكتب ملاحظة</button></div><p class="hint">احكوا عن الموقف مش عن الشخص، واكتبوا شو بتحبوا يصير بدالو.</p></div>';
 out+=nl.length?nl.map(n=>{const th=n.kind==='thanks';return '<article class="card nt'+(th?' thanks':'')+(n.ok?' ok':'')+'"><div class="body"><div class="meta" style="margin-bottom:4px"><span>'+(th?'شكر':'ملاحظة')+' من '+esc(WHO[n.from]||'')+' '+LI(n.to)+'</span><span>'+ago(n.createdAt)+'</span></div><p class="note" style="margin:0">'+esc(n.text)+'</p>'+(n.reply?'<p class="note small" style="margin-top:6px">ردّ '+esc(WHO[n.to]||'')+': '+esc(n.reply)+'</p>':'')+
  (!n.ok&&n.to===me?'<button class="ok-btn" data-nok="'+esc(n.id)+'">'+(th?'تسلم/ي، وصلت':'فهمت عليك، رح انتبه')+'</button>':'')+'</div>'+(n.from===me?'<button class="more" data-nedit="'+esc(n.id)+'" aria-label="تعديل"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>':'')+'</article>'}).join(''):'<div class="empty">'+(noteView==='open'?'ما في ملاحظات مفتوحة. حلو!':'لسّا ما في شي هون')+'</div>';
 el.innerHTML=out;
}
function needMe(){if(!me){toast('لحظة، عم نتعرّف عليك…');return true}return false}
function openPoints(){
 if(needMe())return;
 const to=other(me);
 open('<h2>نقاط '+LI(to)+'</h2><form id="ptf">'+
 '<label class="l">كم نقطة؟</label><div class="vals" id="pval">'+[-5,-3,-1,1,3,5].map(v=>'<button type="button" data-v="'+v+'" aria-pressed="'+(v===3)+'">'+sgn(v)+'</button>').join('')+'</div>'+
 '<label class="l" for="pt-r">ليش؟</label><input class="in" id="pt-r" required maxlength="140" placeholder="مثلاً: فاجأني بقهوة الصبح">'+
 '<div class="acts"><button class="btn pri" type="submit">عطي</button></div></form>');
 pick('#pval','data-v');
 $('#ptf').addEventListener('submit',async e=>{e.preventDefault();const reason=$('#pt-r').value.trim();if(!reason)return;
  const pts=Number(val('#pval','data-v'))||1,t=to;close();
  await write(()=>db.collection('points').add({to:t,from:me,pts,reason,createdAt:Date.now()}),(pts>0?'انبعتت '+sgn(pts)+' لـ':'انسحبت '+(-pts)+' من ')+WHO[t])});
 setTimeout(()=>$('#pt-r')?.focus(),50);

 open('<h2>'+(n.id?'عدّل الملاحظة':'ملاحظة '+LI(to))+'</h2><form id="nf">'+
 '<label class="l">شو نوعها؟</label><div class="seg" id="nkind"><button type="button" data-k="note" aria-pressed="'+(kind==='note')+'">ملاحظة ننتبه عليها</button><button type="button" data-k="thanks" aria-pressed="'+(kind==='thanks')+'">شكر</button></div>'+

 '<div class="acts">'+(n.id?'<button type="button" class="btn del" id="ndel">احذف</button>':'')+'<button class="btn pri" type="submit">'+(n.id?'احفظ':'ابعت')+'</button></div></form>');

  const doc={from:n.from||me,to,kind:val('#nkind','data-k')||'note',text,ok:!!n.ok,reply:n.reply||'',createdAt:n.createdAt||Date.now(),updatedAt:Date.now()};close();
  await write(()=>n.id?db.collection('notes').doc(n.id).set(doc):db.collection('notes').add(doc),n.id?'انحفظ':'انبعتت الملاحظة')});
 const d=$('#ndel');if(d)d.onclick=async()=>{const copy={...n};delete copy.id;close();await write(()=>db.collection('notes').doc(n.id).delete());toast('انحذفت','تراجع',()=>write(()=>db.collection('notes').doc(n.id).set(copy),'رجعت'))};
}
function openOk(n){
 open('<h2>'+(n.kind==='thanks'?'وصلت':'رح انتبه')+'</h2><form id="okf"><p class="note" style="margin:0 0 6px">'+esc(n.text)+'</p><label class="l" for="ok-r">بدك تردّ؟ (مش ضروري)</label><input class="in" id="ok-r" maxlength="200" placeholder="مثلاً: معك حق، سوري"><div class="acts"><button class="btn pri" type="submit">تمام</button></div></form>');
 $('#okf').addEventListener('submit',async e=>{e.preventDefault();const reply=$('#ok-r').value.trim();close();await write(()=>db.collection('notes').doc(n.id).update({ok:true,reply,okAt:Date.now()}),'حلو، انحطّت بالخالصين')});

$('#us').addEventListener('click',async e=>{
 if(e.target.closest('#givePts'))return openPoints();
 if(e.target.closest('#addLetter'))return openLetterEditor();
 const lo=e.target.closest('[data-lopen]');if(lo){const l=letters.find(x=>x.id===lo.dataset.lopen);return l&&readLetter(l)}
 const le=e.target.closest('[data-ledit]');if(le){const l=letters.find(x=>x.id===le.dataset.ledit);return l&&openLetterEditor(l)}
 if(e.target.closest('#addNote'))return openNote();
 const v=e.target.closest('[data-nv]');if(v){noteView=v.dataset.nv;return renderUs()}
 const ok=e.target.closest('[data-nok]');if(ok){const n=notes.find(x=>x.id===ok.dataset.nok);return n&&openOk(n)}
 const ed=e.target.closest('[data-nedit]');if(ed)return openNote(notes.find(x=>x.id===ed.dataset.nedit));
 const pdel=e.target.closest('[data-pdel]');if(pdel){const p=points.find(x=>x.id===pdel.dataset.pdel);if(!p)return;const copy={...p};delete copy.id;await write(()=>db.collection('points').doc(p.id).delete());toast('انحذفت النقاط','تراجع',()=>write(()=>db.collection('points').doc(p.id).set(copy),'رجعت'))}
});

/* ---------- sheets ---------- */
const scrim=$('#scrim'),sheet=$('#sheet');
function open(html){sheet.classList.remove('drag');sheet.style.transform='';scrim.style.opacity='';sheet.innerHTML='<div class="grab"></div>'+html;sheet.scrollTop=0;void sheet.offsetHeight;scrim.classList.add('on');document.body.style.overflow='hidden'}
function close(){sheet.classList.remove('drag');sheet.style.transform='';scrim.style.opacity='';scrim.classList.remove('on');if(vIdx<0)document.body.style.overflow=''}
{let y0=null,t0=0,dy=0,on=false;
 sheet.addEventListener('touchstart',e=>{const g=e.target.closest('.grab');if(!g&&sheet.scrollTop>0){y0=null;return}y0=e.touches[0].clientY;t0=Date.now();dy=0;on=false},{passive:true});
 sheet.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;
  if(!on){if(dy>6&&sheet.scrollTop<=0){on=true;sheet.classList.add('drag');document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}else if(dy<-6){y0=null;return}else return}
  e.preventDefault();const d=Math.max(0,dy);sheet.style.transform='translateY('+d+'px)';scrim.style.opacity=String(Math.max(.25,1-d/(sheet.offsetHeight*1.1)))},{passive:false});
 const end=()=>{if(y0==null)return;y0=null;if(!on)return;on=false;sheet.classList.remove('drag');const v=dy/Math.max(1,Date.now()-t0);
  if(dy>Math.min(140,sheet.offsetHeight*.3)||v>.6){sheet.style.transform='translateY(105%)';scrim.style.opacity='';scrim.classList.remove('on');if(vIdx<0)document.body.style.overflow='';setTimeout(()=>{if(!scrim.classList.contains('on'))sheet.style.transform=''},450)}
  else{sheet.style.transform='';scrim.style.opacity=''}};
 sheet.addEventListener('touchend',end);sheet.addEventListener('touchcancel',end);
}
function animateTab(t){const sec=$('#v-'+t);if(!sec)return;
 const items=[...sec.querySelectorAll('.tools,.albh,.month,.card,.sec,.ph,.empty,.pp')].slice(0,16);
 items.forEach((el,i)=>{el.classList.remove('pop-in');void el.offsetWidth;el.style.animationDelay=(i*35)+'ms';el.classList.add('pop-in')});
 setTimeout(()=>items.forEach(el=>{el.classList.remove('pop-in');el.style.animationDelay=''}),1200)}
scrim.addEventListener('click',e=>{if(e.target===scrim)close()});
const catChips=sel=>'<div class="chips" style="flex-wrap:wrap" id="fcat">'+CATS.map(c=>'<button type="button" class="chip" data-c="'+c.k+'" aria-pressed="'+(sel===c.k)+'"><i class="dot" style="background:'+c.c+'"></i>'+c.n+'</button>').join('')+'</div>';
function pick(container,attr){sheet.querySelector(container).addEventListener('click',e=>{const b=e.target.closest('['+attr+']');if(!b)return;sheet.querySelectorAll(container+' ['+attr+']').forEach(x=>x.setAttribute('aria-pressed',x===b))})}
const val=(container,attr)=>sheet.querySelector(container+' [aria-pressed=true]')?.getAttribute(attr);

 m=m||{};const p=prefill||{};
 const r=Number(m.rating)||0;
 open('<h2>'+(m.id?'عدّل اللحظة':'لحظة جديدة')+'</h2><form id="mf"><label class="l" for="f-t">شو عملتوا؟</label><input class="in" id="f-t" required maxlength="120" placeholder="مثلاً: عشا عالبحر" value="'+esc(m.title||p.title||'')+'">'+

 '<label class="l">نوعها</label>'+catChips(m.cat||p.cat||'out')+otherInput('f-oc',m.catOther,(m.cat||p.cat)==='other','شو نوعها؟ مثلاً: حفلة، تسوّق…')+
 '<label class="l">مين؟</label><div class="seg" id="fwho">'+Object.entries(WHO).map(([k,n])=>'<button type="button" data-w="'+k+'" aria-pressed="'+((m.who||p.who||'both')===k)+'">'+n+'</button>').join('')+'</div>'+
 '<label class="l">قدّيش حلوة؟</label><div class="rate" id="frate">'+[1,2,3,4,5].map(i=>'<button type="button" data-r="'+i+'" class="'+(i<=r?'on':'')+'" aria-label="'+i+'">'+heart+'</button>').join('')+'</div>'+
 '<label class="l" for="f-n">شي بدكن تتذكروه</label><textarea class="in" id="f-n" maxlength="1000" placeholder="تفصيل صغير، جملة قالها حدا، شو طلبتوا…">'+esc(m.note||'')+'</textarea>'+
 '<div class="acts">'+(m.id?'<button type="button" class="btn del" id="fdel">احذف</button>':'')+'<button class="btn pri" type="submit">'+(m.id?'احفظ':'زيدها')+'</button></div></form>');
 let rating=r;

 $('#frate').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const v=Number(b.dataset.r);rating=rating===v?0:v;sheet.querySelectorAll('#frate button').forEach(x=>x.classList.toggle('on',Number(x.dataset.r)<=rating))});
 $('#mf').addEventListener('submit',async e=>{e.preventDefault();

  const doc={title,date:$('#f-d').value||today(),cat:val('#fcat','data-c')||'other',catOther:val('#fcat','data-c')==='other'?$('#f-oc').value.trim():'',who:val('#fwho','data-w')||'both',rating,note:$('#f-n').value.trim(),by:m.by||me||'',createdAt:m.createdAt||Date.now(),updatedAt:Date.now(),editedBy:me||''};
  close();
  await write(()=>m.id?db.collection('moments').doc(m.id).set(doc):db.collection('moments').add(doc),m.id?'انحفظ التعديل':'انزادت لحظة جديدة');
  if(p.planId)await write(()=>db.collection('plans').doc(p.planId).update({moment:true}));
 });
 const del=$('#fdel');if(del)del.onclick=async()=>{const copy={...m};delete copy.id;close();await write(()=>db.collection('moments').doc(m.id).delete());toast('انحذفت','تراجع',()=>write(()=>db.collection('moments').doc(m.id).set(copy),'رجعت'))};
 if(!m.id)setTimeout(()=>$('#f-t')?.focus(),50);

 open('<h2>إعداداتنا</h2><form id="sf"><label class="l" for="s-d">تاريخ خطبتنا</label><input class="in" id="s-d" type="date" value="'+esc(settings.start||'')+'">'+

async function backup(){
 if(!db)return;toast('عم نجهّز النسخة الاحتياطية…');
 const out={app:'hassan-leen',version:1,exportedAt:new Date().toISOString(),by:me,data:{}};
 for(const c of ['moments','plans','weights','notes','points','events','photos','photoFull','letters','profiles']){try{const r=await db.collection(c).get();out.data[c]=r.docs.map(d=>({id:d.id,...d.data()}))}catch(x){}}
 out.data.meta={};for(const k of ['settings','people']){try{const r=await db.doc('meta/'+k).get();if(r.exists)out.data.meta[k]=r.data()}catch(x){}}
 out.data.letterBody=[];for(const l of letters){try{const r=await db.doc('letterBody/'+l.id).get();if(r.exists)out.data.letterBody.push({id:l.id,...r.data()})}catch(x){}}
 const name='hassan-leen-backup-'+today()+'.json',blob=new Blob([JSON.stringify(out)],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){toast('اختار «حفظ في الملفات»');await navigator.share({files:[f],title:name});return}}catch(x){if(x&&x.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('انحفظت النسخة الاحتياطية');
}

function resolveMe(){
 const k=db.who||'';
 if(k!==me){me=k;render();setTimeout(notifyOpened,800)}
 if(!me&&!askedWho&&db.who!==undefined){askedWho=true;banner('هالحساب مش معروف بالتطبيق.')}
 if(me&&profilesLoaded&&!profiles[me]){const c=(settings.fit||{})[me];const b=(settings.bday||{})[me];if(c||b){profiles[me]={...(c||{}),bday:b||''};db.doc('profiles/'+me).set(profiles[me]).catch(()=>{})}}
}

/* ---------- writes ---------- */
async function write(fn,ok){
 if(!db){toast('ما في اتصال بالحفظ هلّق');return}
 try{await fn();ok&&toast(ok)}
 catch(e){const c=e&&e.code;
  if(c==='invalid_argument'||c==='permission-denied'){canWrite=false;banner('هالحساب ما إلو صلاحية. تأكدوا إنو إيميلو مكتوب بقواعد Firestore.')}
  toast(c==='quota_exceeded'?'المساحة امتلت':'ما قدرنا نحفظ، جرّب كمان مرة')}
}

 return '<defs><radialGradient id="mg" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fffdf2"/><stop offset=".6" stop-color="#efe6c9"/><stop offset="1" stop-color="#c9bc98"/></radialGradient>'+

  cr.map(([x,y,s])=>'<circle cx="'+(cx+x*r)+'" cy="'+(cy+y*r)+'" r="'+(s*r)+'" fill="url(#cg)"/><circle cx="'+(cx+x*r-s*r*.18)+'" cy="'+(cy+y*r-s*r*.18)+'" r="'+(s*r*.9)+'" fill="none" stroke="#fffdf0" stroke-opacity=".35" stroke-width="'+(r*.012)+'"/>').join('')+

}
function heartPath(x,y,s){return 'M'+x+' '+(y+s*.35)+'C'+(x-s*.9)+' '+(y-s*.25)+' '+(x-s*.45)+' '+(y-s*.95)+' '+x+' '+(y-s*.45)+'C'+(x+s*.45)+' '+(y-s*.95)+' '+(x+s*.9)+' '+(y-s*.25)+' '+x+' '+(y+s*.35)+'Z'}

function skySvg(ph){

 let o='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">'+c.g.map((v,i)=>'<stop offset="'+(i/(c.g.length-1))+'" stop-color="'+v+'"/>').join('')+'</linearGradient>'+

 if(c.stars){for(let i=0;i<70;i++){const x=rnd()*W,y=rnd()*H*.85,r=rnd()<.12?1.4:.5+rnd()*.7;o+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'" fill="'+(rnd()<.3?'#ffe6aa':'#fff')+'" opacity="'+((.35+rnd()*.6)*c.stars).toFixed(2)+'"/>'}}
 if(ph==='night'){o+=moonSvg(176,46,48,window.__moonF!=null?window.__moonF:moonPhase(Date.now()))+'<path d="'+heartPath(150,40,7)+'" fill="#f1cf83" opacity=".5"/><path d="'+heartPath(340,150,5)+'" fill="#f1cf83" opacity=".35"/>'}
 if(c.sun){const[x,y,r]=c.sun;o+='<circle cx="'+x+'" cy="'+y+'" r="'+(r*3)+'" fill="url(#sun)"/><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c.sun[3]+'" opacity=".85"/>'}
 if(c.clouds){o+=cloud(ph==='day'?90:300,ph==='morning'?120:ph==='evening'?80:150,26,ph==='day'?.55:.22)+cloud(ph==='day'?250:140,ph==='day'?205:200,18,ph==='day'?.4:.16)+

 if(ph!=='night')o+='<rect width="'+W+'" height="'+H+'" fill="url(#ov)"/><defs><linearGradient id="ov" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#0b0e30" stop-opacity="0"/><stop offset="1" stop-color="#0b0e30" stop-opacity="'+(ph==='day'?.45:.35)+'"/></linearGradient></defs>';
 return o+'</svg>';
}
