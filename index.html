<style>
/* VOICE: tender, warm, night-sky romance taken from their own logo (gold ح, silver ل, moon), playful-but-calm — a private shared journal for two
   IDEA: a little shared scrapbook of "our moments", with a plans list and a counter of days together
   PICTURE: two interlocking monogram rings (ح + ل) with a heart where they meet, on a deep plum band
   COLOUR and TYPE: night navy band with stars and moon glow, gold accent, silver text; Aref Ruqaa calligraphy for names, El Messiri headings + IBM Plex Sans Arabic body
   LAYOUT: phone-first single column, hero band, tab content, floating add button, bottom sheets */
:root{color-scheme:light dark;
--bg:light-dark(#f5f3fa,#0b0e24);--card:light-dark(#ffffff,#151a38);--ink:light-dark(#151a3a,#f4efe2);
--mute:light-dark(#696c8c,#a7a5c3);--line:light-dark(#e3e1ef,#272c52);--rose:light-dark(#a8721a,#efc466);--on:light-dark(#fff,#14112c);
--plum:#1a2052;--plum2:#090c24;--soft:light-dark(#f4ecda,#231f45);--gold:#f1cf83}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"El Messiri","IBM Plex Sans Arabic",sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto}
.hero{background:radial-gradient(circle at 12% 22%,rgba(255,230,170,.9) 0 1.2px,transparent 2px),radial-gradient(circle at 34% 8%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 58% 30%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 80% 12%,rgba(255,230,170,.9) 0 1px,transparent 1.6px),radial-gradient(circle at 46% 62%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 90% 70%,#fff 0 1px,transparent 1.6px),radial-gradient(55% 45% at 6% 18%,rgba(241,207,131,.28),transparent 70%),radial-gradient(120% 90% at 85% 0%,#2c2f6e 0%,var(--plum) 45%,var(--plum2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) max(5vw,18px) 26px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{background:rgba(255,255,255,.14);border-radius:99px;padding:8px 14px;font-size:14px;min-height:40px}
.gear{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pic{display:flex;align-items:center;gap:18px;margin-top:14px}
.logo{height:min(54vw,220px);width:auto;flex:none;filter:drop-shadow(0 0 14px rgba(241,207,131,.35)) drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.names{font-family:"Aref Ruqaa",serif;font-weight:700;color:var(--gold);font-size:clamp(38px,11vw,56px);line-height:1.2}
.days{margin-top:8px;font-size:17px;opacity:.92}
.days b{font-family:"El Messiri";font-size:30px;color:var(--gold);margin-inline-end:4px}
.days button{color:var(--gold);text-decoration:underline;padding:6px 0;min-height:44px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.kpi{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-family:"El Messiri";font-size:24px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:13px;opacity:.8}
.soon{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.ev{flex:none;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:14px;white-space:nowrap}
.ev b{color:var(--gold);font-family:"El Messiri";font-size:17px}
.ev.today{background:var(--gold);color:#14112c}.ev.today b{color:#14112c}
.tabs{display:flex;gap:6px;padding:16px max(5vw,18px) 6px;position:sticky;top:0;z-index:5;background:var(--bg)}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs button{flex:1 0 auto;min-height:44px;border-radius:14px;font-weight:500;color:var(--mute);font-size:15px;padding:0 12px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
main{padding:8px max(5vw,18px) calc(110px + env(safe-area-inset-bottom))}
.tools{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.search{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:var(--on)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.month{font-size:14px;color:var(--mute);margin:18px 4px 8px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.date{flex:none;width:48px;text-align:center;border-inline-end:1px solid var(--line);padding-inline-end:12px}
.date b{display:block;font-family:"El Messiri";font-size:26px;line-height:1.1}
.date span{font-size:12px;color:var(--mute)}
.body{flex:1}
.body h3{font-size:18px;margin-bottom:4px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mute);align-items:center}
.meta .tag{display:inline-flex;align-items:center;gap:5px}
.note{margin:8px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.hearts{display:inline-flex;gap:1px;color:var(--rose)}
.hearts svg{width:14px;height:14px}
.more{flex:none;width:40px;height:40px;border-radius:12px;color:var(--mute);display:grid;place-items:center;margin:-6px -8px 0 0}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.plan{align-items:center}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--rose);display:grid;place-items:center}
.plan.done .check{background:var(--rose);color:var(--on)}
.plan.done h3{text-decoration:line-through;color:var(--mute)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.sec h2{font-size:20px;margin-bottom:12px}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--rose);transition:width .5s}
.row .n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big{font-family:"El Messiri";font-size:34px;line-height:1.1}
.fab{position:fixed;inset-inline-start:max(18px,calc(50% - 300px));bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--rose);color:var(--on);box-shadow:0 10px 28px rgba(200,150,50,.45);display:grid;place-items:center;z-index:10}
.fab svg{width:28px;height:28px}
.scrim{position:fixed;inset:0;background:rgba(5,6,20,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .42s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .3s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;padding:10px max(5vw,18px) calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.scrim.on .sheet{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px;box-shadow:0 0 0 14px transparent;touch-action:none}
.sheet h2{font-size:24px;margin-bottom:14px}
label.l{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px;font-weight:500}
.in{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:42px;border-radius:10px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rate{display:flex;gap:6px}
.rate button{width:44px;height:44px;display:grid;place-items:center;color:var(--line)}
.rate button.on{color:var(--rose)}
.rate svg{width:30px;height:30px}
.acts{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;min-height:52px;border-radius:16px;font-weight:700;background:var(--soft)}
.btn.pri{background:var(--rose);color:var(--on)}
.btn.del{color:var(--rose)}
.toast{position:fixed;bottom:calc(98px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:70;width:max-content;max-width:calc(100vw - 32px);font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--rose);font-weight:700;min-height:36px}
.banner{margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;display:none}
.banner.on{display:block}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.who button{min-height:110px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-family:"El Messiri";font-size:28px}
.small{font-size:13px;color:var(--mute);margin-top:12px}
.pp h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pp .cur{font-family:"El Messiri";font-size:40px;line-height:1.1;white-space:nowrap}
.pp .cur small{font-size:16px;color:var(--mute);margin-inline-start:4px}
.pp .chg{font-size:14px;color:var(--mute);white-space:nowrap}
.fig{position:relative;height:150px;margin:12px 0 4px;direction:ltr}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.logs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.log{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;white-space:nowrap}
.log button{width:28px;height:28px;border-radius:50%;color:var(--mute)}
.mini{display:flex;gap:8px;margin-top:12px}.mini .btn{min-height:44px;font-size:15px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:center}
.score>div{background:var(--soft);border-radius:18px;padding:14px 8px}
.score .big{font-size:44px}.score .big.neg{color:var(--mute)}
.pt{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pv{flex:none;min-width:48px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--soft);color:var(--rose);font-variant-numeric:tabular-nums}
.pv.neg{color:var(--mute)}
.pt .body{font-size:15px}.pt .small{margin:0}
.x{flex:none;width:36px;height:36px;border-radius:50%;color:var(--mute)}
.nt{border-inline-start:4px solid var(--rose)}.nt.thanks{border-inline-start-color:#2bb39a}.nt.ok{opacity:.6}
.ok-btn{margin-top:10px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--soft);font-weight:500;font-size:14px}
.vals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.vals button{min-height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;direction:ltr}
.vals button[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:var(--on)}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calh h2{margin:0}.nav{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.grid .wd{font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-size:15px;min-height:40px}
.day.out{opacity:.3}.day.td{outline:2px solid var(--rose);outline-offset:-2px}
.day[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.day .ds{display:flex;gap:2px;height:6px}.day .ds i{width:6px;height:6px;border-radius:50%}
.evr{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.evr:first-of-type{border-top:0}
.evr .cd{flex:none;min-width:58px;text-align:center;border-radius:12px;background:var(--soft);padding:6px 4px;font-size:12px;color:var(--mute)}
.evr .cd b{display:block;font-family:"El Messiri";font-size:20px;color:var(--rose);line-height:1.1}
.login{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(55% 45% at 10% 15%,rgba(241,207,131,.25),transparent 70%),radial-gradient(120% 90% at 85% 0%,#2c2f6e 0%,#1a2052 45%,#090c24 100%);color:#fff}
.login.on{display:flex}.login form{width:100%;max-width:360px;text-align:center}
.login img{height:180px;filter:drop-shadow(0 0 14px rgba(241,207,131,.35))}
.login h1{font-family:"Aref Ruqaa",serif;color:var(--gold);font-size:44px;margin:8px 0 18px}
.login .in{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;margin-bottom:10px;text-align:start}
.login .in::placeholder{color:rgba(255,255,255,.55)}
.login .btn{width:100%;background:var(--gold);color:#14112c}
.login .err{min-height:22px;font-size:14px;color:#ffb4b4;margin-top:10px}
.albh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px}
.albh .seg{flex:1;max-width:260px}
.alb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
@media(min-width:560px){.alb{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft);padding:0;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{position:absolute;bottom:6px;inset-inline-start:6px;width:18px;height:18px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(5,6,15,var(--va,1));display:flex;flex-direction:column;color:#fff;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s .28s}
.viewer.on{opacity:1;visibility:visible;transition:opacity .28s ease}
#vi{transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s}
.viewer:not(.on) #vi{transform:scale(.9)}
#vi.drag{transition:none}
#vi.swap{animation:fadein .3s ease}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.vtop div{display:flex;gap:8px}
.vbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.vbtn.on{color:var(--gold)}.vbtn svg{width:22px;height:22px}
.vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}
.vimg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.vnav{position:absolute;top:50%;transform:translateY(-50%)}
.vnav.n{left:10px}.vnav.p{right:10px}
.vcap{padding:12px 18px calc(18px + env(safe-area-inset-bottom));text-align:center}
.vcap p{margin:0 0 4px;font-size:17px;overflow-wrap:anywhere}
.vcap span{font-size:13px;opacity:.7}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:.2}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.pop-in{animation:rise .45s cubic-bezier(.2,.9,.25,1) both}
.tabs button{transition:background .25s,color .25s,transform .12s}
.btn,.chip,.fab,.tabs button,.ph,.day,.check,.vbtn,.more,.seg button,.who button,.vals button,.rate button,.nav{transition:transform .12s ease,background .2s,color .2s}
.btn:active,.chip:active,.fab:active,.tabs button:active,.ph:active,.day:active,.check:active,.vbtn:active,.more:active,.seg button:active,.who button:active,.vals button:active,.nav:active{transform:scale(.95)}
.rate button.on svg,.vbtn.on svg,.check.popped{animation:pop .35s ease}
.fab{transition:transform .2s cubic-bezier(.2,.9,.25,1),box-shadow .2s}
.fab.hide{transform:scale(0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

const pd=s=>{const [y,m,d]=String(s||today()).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const heart='<svg><use href="#h"/></svg>';
let events=[],calM=null,selDay=null,photos=[],albF='all',vList=[],vIdx=-1;
let db=null,moments=[],plans=[],weights=[],notes=[],points=[],noteView='open',settings={},me='',tab='moments',filter='all',q='',canWrite=true;

/* ---------- toast ---------- */
let tt;
function toast(msg,btn,fn){$('#tmsg').textContent=msg;const b=$('#tbtn');b.textContent=btn||'';b.hidden=!btn;b.onclick=()=>{hideToast();fn&&fn()};$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(hideToast,btn?6000:2600)}

/* ---------- header ---------- */
function renderHead(){
 $('#meBtn').textContent=me?('أنا '+WHO[me]):'مين أنا؟';
 const d=$('#days');
 if(settings.start){const n=Math.max(0,Math.floor((pd(today())-pd(settings.start))/864e5));d.innerHTML='سوا من <b>'+n.toLocaleString(L)+'</b> يوم'}
 else d.innerHTML='<button id="setStart">حطّوا تاريخ ارتباطكن</button>';
 const sb=$('#setStart');if(sb)sb.onclick=openSettings;
 renderSoon();
 const ym=today().slice(0,7);
 const month=moments.filter(m=>String(m.date).startsWith(ym)).length;
 const cnt={};moments.forEach(m=>cnt[m.cat]=(cnt[m.cat]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 $('#kpis').innerHTML=[[month,'هالشهر'],[moments.length,'كل لحظاتنا'],[top?cat(top[0]).n:'—','أكتر شي منعملو']].map(([v,l])=>'<div class="kpi"><b>'+esc(v)+'</b><span>'+l+'</span></div>').join('');
}

function nextOf(iso){const b=pd(iso),t=pd(today());let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return {days:Math.round((n-t)/864e5),years:n.getFullYear()-b.getFullYear()}}
function renderSoon(){
 const ev=[],bd=settings.bday||{};
 if(bd.leen)ev.push({iso:bd.leen,n:'عيد ميلاد لين',ty:'b'});
 if(bd.hassan)ev.push({iso:bd.hassan,n:'عيد ميلاد حسن',ty:'b'});
 if(settings.start)ev.push({iso:settings.start,n:'ذكرى خطبتنا',ty:'a'});
 const list=ev.map(e=>({...e,...nextOf(e.iso)})).filter(e=>e.years>0||e.ty==='b').sort((a,b)=>a.days-b.days);
 $('#soon').innerHTML=list.map(e=>{const what=e.ty==='b'?' ('+e.years+')':(e.years===1?' الأولى':' الـ'+e.years);
  return e.days===0?'<div class="ev today"><b>اليوم</b> '+e.n+what+(e.ty==='b'?' · كل سنة وإنت سالم'+(e.n.includes('لين')?'ة':''):' · كل سنة وإنتو سوا')+'</div>':'<div class="ev">'+e.n+what+' بعد <b>'+e.days+'</b> يوم</div>'}).join('');
}

/* ---------- moments ---------- */
function renderFilters(){
 $('#filters').innerHTML=[{k:'all',n:'الكل'},...CATS].map(c=>'<button class="chip" data-f="'+c.k+'" aria-pressed="'+(filter===c.k)+'">'+(c.c?'<i class="dot" style="background:'+c.c+'"></i>':'')+c.n+'</button>').join('');
}
function hearts(n){return n?'<span class="hearts" aria-label="'+n+' من 5">'+heart.repeat(n)+'</span>':''}
function renderMoments(){
 const ql=q.trim();
 const list=moments.filter(m=>(filter==='all'||m.cat===filter)&&(!ql||(String(m.title)+' '+String(m.note||'')).includes(ql))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.createdAt||0)-(a.createdAt||0));
 if(!list.length){$('#list').innerHTML=moments.length?'<div class="empty"><h3>ما في شي هون</h3>جرّبوا فلتر أو كلمة تانية</div>':'<div class="empty"><h3>أول لحظة إلكن؟</h3>كبسوا على + وسجّلوا شو عملتوا اليوم سوا</div>';return}
 let out='',last='';
 for(const m of list){
  const d=pd(m.date),mk=String(m.date).slice(0,7);
  if(mk!==last){out+='<div class="month">'+d.toLocaleDateString(L,{month:'long',year:'numeric'})+'</div>';last=mk}
  const c=cat(m.cat);
  out+='<article class="card"><div class="date"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString(L,{weekday:'short'})+'</span></div><div class="body"><h3>'+esc(m.title)+'</h3><div class="meta"><span class="tag"><i class="dot" style="background:'+c.c+'"></i>'+c.n+'</span><span>'+esc(WHO[m.who]||'سوا')+'</span>'+hearts(Math.min(5,Math.max(0,Number(m.rating)||0)))+'</div>'+(m.note?'<p class="note">'+esc(m.note)+'</p>':'')+(m.by?'<div class="small" style="margin-top:6px">زادها '+esc(WHO[m.by]||'')+'</div>':'')+'</div><button class="more" data-edit="'+esc(m.id)+'" aria-label="تعديل"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button></article>';
 }
 $('#list').innerHTML=out;
}

/* ---------- plans ---------- */
function renderPlans(){
 const list=[...plans].sort((a,b)=>(!!a.done-!!b.done)||(b.createdAt||0)-(a.createdAt||0));
 if(!list.length){$('#plist').innerHTML='<div class="empty"><h3>شو بدكن تعملوا سوا؟</h3>حطّوا هون أحلامكن الصغيرة والكبيرة: مطعم بدكن تجرّبوه، سفرة، فيلم…</div>';return}
 const open=list.filter(p=>!p.done).length;
 $('#plist').innerHTML='<div class="month">'+open+' لسّا ناطرين · '+(list.length-open)+' عملناهن</div>'+list.map(p=>{const c=cat(p.cat);return '<article class="card plan'+(p.done?' done':'')+'"><button class="check" data-tog="'+esc(p.id)+'" aria-label="'+(p.done?'رجّعها':'عملناها')+'">'+(p.done?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>':'')+'</button><div class="body"><h3>'+esc(p.title)+'</h3><div class="meta"><span class="tag"><i class="dot" style="background:'+c.c+'"></i>'+c.n+'</span>'+(p.when?'<span>'+pd(p.when).toLocaleDateString(L,{day:'numeric',month:'short'})+'</span>':'')+(p.by?'<span>من '+esc(WHO[p.by]||'')+'</span>':'')+'</div></div><button class="more" data-pedit="'+esc(p.id)+'" aria-label="تعديل"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button></article>'}).join('');
}

/* ---------- stats ---------- */
function rows(arr){const mx=Math.max(1,...arr.map(a=>a[1]));return arr.map(([l,v])=>'<div class="row"><span>'+l+'</span><div class="bar"><i style="width:'+(v/mx*100)+'%"></i></div><span class="n">'+v+'</span></div>').join('')}
function renderStats(){
 if(!moments.length){$('#stats').innerHTML='<div class="empty"><h3>الأرقام بتجي مع اللحظات</h3>سجّلوا كم شغلة وارجعوا لهون</div>';return}
 const now=new Date(),months=[];
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push([d.toLocaleDateString(L,{month:'long'}),moments.filter(m=>String(m.date).startsWith(k)).length])}
 const cats=CATS.map(c=>[c.n,moments.filter(m=>m.cat===c.k).length]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]);
 const rated=moments.filter(m=>Number(m.rating)>0);
 const avg=rated.length?(rated.reduce((s,m)=>s+Number(m.rating),0)/rated.length).toFixed(1):'—';
 // weekly streak
 const wk=d=>{const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+1)%7));return t.getTime()};
 const weeks=new Set(moments.map(m=>wk(pd(m.date))));let s=0,w=wk(new Date());if(!weeks.has(w))w-=6048e5;while(weeks.has(w)){s++;w-=6048e5}
 const best=[...moments].filter(m=>Number(m.rating)===5).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,3);
 const done=plans.filter(p=>p.done).length;
 $('#stats').innerHTML=
 '<div class="duo"><div class="sec"><div class="big">'+s+'</div><div class="small" style="margin:0">أسابيع ورا بعض فيها لحظة</div></div><div class="sec"><div class="big">'+avg+'</div><div class="small" style="margin:0">معدّل القلوب</div></div></div>'+
 '<div class="sec"><h2>آخر ٦ شهور</h2>'+rows(months)+'</div>'+
 '<div class="sec"><h2>شو منحب نعمل</h2>'+rows(cats)+'</div>'+
 '<div class="sec"><h2>مين بيسجّل أكتر</h2>'+rows([['حسن',moments.filter(m=>m.by==='hassan').length],['لين',moments.filter(m=>m.by==='leen').length]])+'<div class="small">وعملتوا '+done+' من '+plans.length+' من خططكن</div></div>'+
 (best.length?'<div class="sec"><h2>أحلى لحظات</h2>'+best.map(m=>'<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span>'+esc(m.title)+'</span><span class="n">'+pd(m.date).toLocaleDateString(L,{day:'numeric',month:'short'})+'</span></div>').join('')+'</div>':'');
}

function render(){renderHead();renderFilters();renderMoments();renderPlans();renderStats();renderFit();renderUs();renderCal();renderAlbum()}

/* ---------- fitness ---------- */
const num=v=>{const n=Number(v);return isFinite(n)&&n>0?n:null};
const f1=n=>(Math.round(n*10)/10).toLocaleString(L);
const ros={};
function fitData(k){
 const c=(settings.fit||{})[k]||{};
 const logs=weights.filter(w=>w.who===k&&num(w.kg)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.createdAt||0)-(b.createdAt||0));
 const h=num(c.h),target=num(c.target),start=num(c.start)??(logs[0]?num(logs[0].kg):null);
 const cur=logs.length?num(logs[logs.length-1].kg):start;
 return {h,target,start,cur,logs};
}
function renderFit(){
 const el=$('#fit');if(!el)return;
 const ym=today().slice(0,7);
 const sport=moments.filter(m=>m.cat==='sport'&&String(m.date).startsWith(ym));
 let out='<div class="sec"><h2>تمرّنا هالشهر</h2><div class="duo"><div><div class="big">'+sport.filter(m=>m.who==='both').length+'</div><div class="hint">مرّة سوا</div></div><div><div class="big">'+sport.length+'</div><div class="hint">كل التمارين</div></div></div><div class="mini"><button class="btn pri" id="addWork">سجّلوا تمرين</button></div></div>';
 for(const k of ['hassan','leen']){
  const d=fitData(k);
  let bar='',left='',bmi='';
  if(d.cur&&d.target&&d.start){
   const span=d.target-d.start;const pr=span?Math.min(1,Math.max(0,(d.cur-d.start)/span)):1;
   const rem=d.target-d.cur;
   left=Math.abs(rem)<0.05?'وصلت للهدف!':(rem>0?'باقي '+f1(rem)+' كغ زيادة':'باقي '+f1(-rem)+' كغ نزول');
   bar='<div class="row" style="grid-template-columns:minmax(0,1fr) 3em"><div class="bar"><i style="width:'+(pr*100)+'%"></i></div><span class="n">'+Math.round(pr*100)+'%</span></div>';
  }
  if(d.h&&d.cur){const m=d.h/100,b=d.cur/(m*m);bmi='مؤشر كتلة الجسم '+f1(b)+' · الوزن الصحي لطول '+d.h+' سم تقريباً '+Math.round(18.5*m*m)+'–'+Math.round(24.9*m*m)+' كغ'}
  const wk=d.logs.length>1?(()=>{const last=d.logs[d.logs.length-1],ref=[...d.logs].reverse().find(x=>pd(last.date)-pd(x.date)>=6*864e5);return ref?(num(last.kg)-num(ref.kg)):null})():null;
  out+='<div class="sec pp"><h2><span>'+WHO[k]+'</span>'+(wk!=null?'<span class="chg">'+(wk>0?'+':'')+f1(wk)+' كغ هالأسبوع</span>':'')+'</h2>'+
   (d.cur?'<div class="cur">'+f1(d.cur)+'<small>كغ</small></div>':'<p class="hint">لسّا ما في وزن مسجّل</p>')+
   '<div class="meta">'+(d.start?'<span>البداية '+f1(d.start)+'</span>':'')+(d.target?'<span>الهدف '+f1(d.target)+'</span>':'')+(left?'<span style="color:var(--rose);font-weight:500">'+left+'</span>':'')+'</div>'+bar+
   '<div class="fig" id="fig-'+k+'"><svg></svg></div>'+(bmi?'<div class="hint">'+bmi+'</div>':'')+
   (d.logs.length?'<div class="logs">'+d.logs.slice(-4).reverse().map(w=>'<span class="log">'+f1(num(w.kg))+' · '+pd(w.date).toLocaleDateString(L,{day:'numeric',month:'short'})+'<button data-wdel="'+esc(w.id)+'" aria-label="احذف">×</button></span>').join('')+'</div>':'')+
   '<div class="mini"><button class="btn pri" data-wadd="'+k+'">سجّل وزن</button><button class="btn" data-goal="'+k+'">الطول والهدف</button></div></div>';
 }
 out+='<p class="hint">الأرقام تقريبية ومؤشر كتلة الجسم دليل عام بس. الأحسن تنزلوا أو تزيدوا شوي شوي، والأفضل تاخدوا خطة من دكتور أو أخصائي تغذية.</p>';
 el.innerHTML=out;
 for(const k of ['hassan','leen']){const box=$('#fig-'+k);if(ros[k])ros[k].disconnect();ros[k]=new ResizeObserver(()=>drawW(box,k));ros[k].observe(box)}
}
function drawW(box,k){
 const s=box.querySelector('svg'),W=box.clientWidth,H=box.clientHeight;if(!W)return;
 const d=fitData(k),pts=d.logs.map(w=>({t:pd(w.date).getTime(),v:num(w.kg)}));
 if(pts.length<2){s.innerHTML='<text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" font-size="14" fill="currentColor" opacity=".55" direction="rtl">سجّل وزنك كل أسبوع لتشوف الخط</text>';return}
 const vs=pts.map(p=>p.v).concat(d.target?[d.target]:[]);let lo=Math.min(...vs)-1,hi=Math.max(...vs)+1;
 const t0=pts[0].t,t1=Math.max(pts[pts.length-1].t,t0+864e5),pl=34,pr=14,pt=12,pb=22;
 const x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 let g='';
 [lo+1,hi-1].forEach(v=>g+='<text x="4" y="'+(y(v)+4)+'" font-size="11" fill="currentColor" opacity=".55">'+Math.round(v)+'</text><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="currentColor" opacity=".1"/>');
 if(d.target)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(d.target)+'" y2="'+y(d.target)+'" stroke="var(--rose)" stroke-dasharray="5 5" opacity=".8"/>';
 const path=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join('');
 g+='<path d="'+path+' L'+x(pts[pts.length-1].t)+' '+(H-pb)+' L'+x(t0)+' '+(H-pb)+'Z" fill="var(--rose)" opacity=".1"/><path d="'+path+'" fill="none" stroke="var(--rose)" stroke-width="2.5" stroke-linejoin="round"/>';
 const lp=pts[pts.length-1];g+='<circle cx="'+x(lp.t)+'" cy="'+y(lp.v)+'" r="5" fill="var(--rose)" stroke="var(--card)" stroke-width="2"/>';
 if(W>320){const fd=t=>new Date(t).toLocaleDateString(L,{day:'numeric',month:'short'});g+='<text x="'+pl+'" y="'+(H-5)+'" font-size="11" fill="currentColor" opacity=".55">'+fd(t0)+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" font-size="11" text-anchor="end" fill="currentColor" opacity=".55">'+fd(lp.t)+'</text>'}
 s.innerHTML=g;
}
function openWeight(k){
 open('<h2>سجّل وزن</h2><form id="wf"><label class="l">لمين؟</label><div class="seg" id="wwho"><button type="button" data-w="hassan" aria-pressed="'+(k==='hassan')+'">حسن</button><button type="button" data-w="leen" aria-pressed="'+(k==='leen')+'">لين</button></div>'+
 '<label class="l" for="w-kg">الوزن (كغ)</label><input class="in" id="w-kg" type="number" inputmode="decimal" step="0.1" min="30" max="250" required>'+
 '<label class="l" for="w-d">التاريخ</label><input class="in" id="w-d" type="date" value="'+today()+'"><p class="hint">نصيحة: وزنوا حالكن بنفس الوقت كل أسبوع، الصبح قبل الأكل.</p><div class="acts"><button class="btn pri" type="submit">احفظ</button></div></form>');
 pick('#wwho','data-w');
 $('#wf').addEventListener('submit',async e=>{e.preventDefault();const kg=num($('#w-kg').value);if(!kg)return;
  const who=val('#wwho','data-w')||k;close();await write(()=>db.collection('weights').add({who,kg,date:$('#w-d').value||today(),by:me||'',createdAt:Date.now()}),'انسجّل الوزن')});
 setTimeout(()=>$('#w-kg')?.focus(),50);
}
function openGoal(k){
 const c=(settings.fit||{})[k]||{};
 open('<h2>'+WHO[k]+': الطول والهدف</h2><form id="gf"><label class="l" for="g-h">الطول (سم)</label><input class="in" id="g-h" type="number" inputmode="decimal" min="120" max="230" value="'+esc(c.h||'')+'">'+
 '<label class="l" for="g-s">وزن البداية (كغ)</label><input class="in" id="g-s" type="number" inputmode="decimal" step="0.1" value="'+esc(c.start||'')+'">'+
 '<label class="l" for="g-t">الهدف (كغ)</label><input class="in" id="g-t" type="number" inputmode="decimal" step="0.1" value="'+esc(c.target||'')+'"><p class="hint" id="g-r"></p><div class="acts"><button class="btn pri" type="submit">احفظ</button></div></form>');
 const upd=()=>{const h=num($('#g-h').value);$('#g-r').textContent=h?'الوزن الصحي لهالطول تقريباً '+Math.round(18.5*(h/100)**2)+'–'+Math.round(24.9*(h/100)**2)+' كغ':''};upd();$('#g-h').addEventListener('input',upd);
 $('#gf').addEventListener('submit',async e=>{e.preventDefault();const fit={...(settings.fit||{})};fit[k]={h:num($('#g-h').value),start:num($('#g-s').value),target:num($('#g-t').value)};close();await write(()=>db.doc('meta/settings').set({...settings,fit}),'انحفظ الهدف')});
}
$('#fit').addEventListener('click',async e=>{
 const a=e.target.closest('[data-wadd]');if(a)return openWeight(a.dataset.wadd);
 const g=e.target.closest('[data-goal]');if(g)return openGoal(g.dataset.goal);
 if(e.target.closest('#addWork'))return openMoment(null,{title:'تمرين',cat:'sport'});
 const x=e.target.closest('[data-wdel]');if(!x)return;const w=weights.find(v=>v.id===x.dataset.wdel);if(!w)return;
 const copy={...w};delete copy.id;await write(()=>db.collection('weights').doc(w.id).delete());toast('انحذف الوزن','تراجع',()=>write(()=>db.collection('weights').doc(w.id).set(copy),'رجع'));
});

/* ---------- album ---------- */
const okImg=u=>typeof u==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u);
function albList(){return photos.filter(p=>albF==='all'||p.fav).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.createdAt||0)-(a.createdAt||0))}
function renderAlbum(){
 const el=$('#alb');if(!el)return;
 const list=albList();
 $('#albn').textContent=photos.length?photos.length+' صورة':'';
 if(!list.length){el.innerHTML='<div class="empty"><h3>'+(albF==='fav'&&photos.length?'لسّا ما في مفضّلة':'ألبوم ذكرياتكن')+'</h3>'+(albF==='fav'&&photos.length?'افتحوا صورة وكبسوا القلب':'كبسوا على + واختاروا أحلى صوركن سوا')+'</div>';return}
 el.innerHTML='<div class="alb">'+list.map(p=>'<button class="ph" data-ph="'+esc(p.id)+'" aria-label="'+esc(p.caption||'صورة')+'">'+(okImg(p.thumb)?'<img loading="lazy" alt="" src="'+p.thumb+'">':'')+(p.fav?'<svg><use href="#h"/></svg>':'')+'</button>').join('')+'</div>';
}
function shrink(file,max,q,limit,square){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;
  if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=m}
  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  let out=c.toDataURL('image/jpeg',q);while(out.length>limit&&q>0.35){q-=0.08;out=c.toDataURL('image/jpeg',q)}
  URL.revokeObjectURL(url);out.length>limit?rej(new Error('big')):res(out)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};img.src=url})}
async function uploadPhotos(files){

 files=[...files].filter(f=>f.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
 let ok=0,bad=0;
 for(let i=0;i<files.length;i++){const f=files[i];
  toast('عم نرفع '+(i+1)+' من '+files.length+'…');
  try{const full=await shrink(f,1600,.82,900000,false),thumb=await shrink(f,360,.72,120000,true);
   const ref=db.collection('photos').doc();const d=new Date(f.lastModified||Date.now());
   await db.doc('photoFull/'+ref.id).set({data:full});
   await ref.set({thumb,caption:'',date:iso(d),fav:false,by:me||'',createdAt:Date.now()});ok++}
  catch(e){bad++;if(e&&e.code==='permission-denied')break}
 }
 toast(ok?('انزادت '+ok+(ok===1?' صورة':' صور')+(bad?' · '+bad+' ما زبطت':'')):'ما قدرنا نرفع الصور، جرّبوا كمان مرة');
}

const EK=[{k:'date',n:'موعد',c:'#e0336a'},{k:'trip',n:'سفر',c:'#3a8dde'},{k:'family',n:'عيلة',c:'#d4a017'},{k:'big',n:'يوم كبير',c:'#8b5cf6'},{k:'other',n:'شي تاني',c:'#8a7684'}];

function allEvents(){
 const out=events.filter(e=>e.date).map(e=>({...e,c:ek(e.kind).c}));
 const bd=settings.bday||{};
 if(bd.hassan)out.push({auto:1,title:'عيد ميلاد حسن',date:bd.hassan,yearly:true,c:'#f08a4b',age:1});
 if(bd.leen)out.push({auto:1,title:'عيد ميلاد لين',date:bd.leen,yearly:true,c:'#f08a4b',age:1});
 if(settings.start)out.push({auto:1,title:'ذكرى خطبتنا',date:settings.start,yearly:true,c:'#e0336a',ann:1});
 return out;
}
function onDay(e,ds){
 if(!e.yearly)return e.date===ds;
 if(e.date.slice(5)!==ds.slice(5))return false;
 const y=Number(ds.slice(0,4))-Number(e.date.slice(0,4));return e.ann?y>0:y>=0;
}
function label(e,ds){const y=Number(ds.slice(0,4))-Number(String(e.date).slice(0,4));return e.title+(e.age?' ('+y+')':e.ann?' · '+y+(y===1?' سنة':' سنين'):'')}
function renderCal(){
 const el=$('#cal');if(!el)return;
 const t=pd(today());if(!calM)calM=new Date(t.getFullYear(),t.getMonth(),1);
 const all=allEvents(),y=calM.getFullYear(),m=calM.getMonth();
 const first=new Date(y,m,1),off=(first.getDay()+1)%7,start=new Date(y,m,1-off);
 let g='<div class="sec"><div class="calh"><button class="nav" data-cm="-1" aria-label="الشهر الماضي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button><h2>'+calM.toLocaleDateString(L,{month:'long',year:'numeric'})+'</h2><button class="nav" data-cm="1" aria-label="الشهر الجاي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg></button></div><div class="grid">'+
  ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(d=>'<div class="wd">'+d+'</div>').join('');
 for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),ds=iso(d);
  if(i===35&&d.getMonth()!==m)break;
  const evs=all.filter(e=>onDay(e,ds)).slice(0,3);
  g+='<button class="day'+(d.getMonth()!==m?' out':'')+(ds===today()?' td':'')+'" data-day="'+ds+'" aria-pressed="'+(ds===selDay)+'">'+d.getDate()+'<span class="ds">'+evs.map(e=>'<i style="background:'+e.c+'"></i>').join('')+'</span></button>'}
 g+='</div></div>';
 if(selDay){const evs=all.filter(e=>onDay(e,selDay));
  g+='<div class="sec"><h2>'+pd(selDay).toLocaleDateString(L,{weekday:'long',day:'numeric',month:'long'})+'</h2>'+(evs.length?evs.map(e=>evRow(e,selDay,null)).join(''):'<p class="hint">ما في شي بهاليوم.</p>')+'<div class="mini"><button class="btn pri" id="addEv">زيد شي لهاليوم</button></div></div>'}
 // upcoming
 const up=[];for(const e of all){for(let k=0;k<366;k++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+k),ds=iso(d);if(onDay(e,ds)){up.push({e,ds,k});break}}}
 up.sort((a,b)=>a.k-b.k);
 g+='<div class="sec"><h2>جايين قريب</h2>'+(up.length?up.slice(0,8).map(u=>evRow(u.e,u.ds,u.k)).join(''):'<p class="hint">سجّلوا أول يوم مهم جايي: سفرة، عزيمة، كتب كتاب…</p>')+'</div>';
 el.innerHTML=g;
}

const scrim=$('#scrim'),sheet=$('#sheet');
function open(html){sheet.classList.remove('drag');sheet.style.transform='';scrim.style.opacity='';sheet.innerHTML='<div class="grab"></div>'+html;sheet.scrollTop=0;void sheet.offsetHeight;scrim.classList.add('on');document.body.style.overflow='hidden'}
function close(){sheet.classList.remove('drag');sheet.style.transform='';scrim.style.opacity='';scrim.classList.remove('on');if(vIdx<0)document.body.style.overflow=''}
{let y0=null,t0=0,dy=0,on=false;
 sheet.addEventListener('touchstart',e=>{const g=e.target.closest('.grab');if(!g&&sheet.scrollTop>0){y0=null;return}y0=e.touches[0].clientY;t0=Date.now();dy=0;on=false},{passive:true});
 sheet.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;
  if(!on){if(dy>6&&sheet.scrollTop<=0){on=true;sheet.classList.add('drag');document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}else if(dy<-6){y0=null;return}else return}
  e.preventDefault();const d=Math.max(0,dy);sheet.style.transform='translateY('+d+'px)';scrim.style.opacity=String(Math.max(.25,1-d/(sheet.offsetHeight*1.1)))},{passive:false});
 const end=()=>{if(y0==null)return;y0=null;if(!on)return;on=false;sheet.classList.remove('drag');const v=dy/Math.max(1,Date.now()-t0);
  if(dy>Math.min(140,sheet.offsetHeight*.3)||v>.6){sheet.style.transform='translateY(105%)';scrim.style.opacity='';scrim.classList.remove('on');if(vIdx<0)document.body.style.overflow='';setTimeout(()=>{if(!scrim.classList.contains('on'))sheet.style.transform=''},450)}
  else{sheet.style.transform='';scrim.style.opacity=''}};
 sheet.addEventListener('touchend',end);sheet.addEventListener('touchcancel',end);
}
